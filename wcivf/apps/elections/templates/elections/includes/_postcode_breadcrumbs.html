{% extends "elections/includes/_base_breadcrumbs.html" %}
{% load i18n %}

{% block extra_crumbs %}
    {% if uprn and postcode %}
        <li>
            <a href="{% url 'uprn_view' postcode uprn %}">{% trans "Elections in" %} {{ postcode }}</a>
        </li>
    {% elif postcode %}
        <li>
            <a href="{% url 'postcode_view' postcode %}">{% trans "Elections in" %} {{ postcode }}</a>
        </li>
    {% endif %}
{% endblock %}
